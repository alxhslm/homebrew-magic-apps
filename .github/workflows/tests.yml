name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Run brew style
        run: brew style alxhslm/magic-apps

      - name: Run brew audit
        run: brew audit --cask alxhslm/magic-apps/magimail alxhslm/magic-apps/magical
